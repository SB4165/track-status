<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>트랙 업무 진행현황</title>
  <meta name="theme-color" content="#f5f6f8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title">
        <h1>트랙 업무 진행현황</h1>
        <span class="sub" id="lastSync">불러오는 중…</span>
      </div>
      <div class="actions">
        <button class="btn ghost" id="userBtn" title="작성자 이름 변경">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <span id="userName">이름 설정</span>
        </button>
        <button class="btn" id="refreshBtn" title="새로고침">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          <span class="hide-sm">새로고침</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats"></section>
    <div class="legend" id="legend"></div>
    <div class="banner" id="banner" hidden></div>
    <section class="board" id="board" aria-label="배치도"></section>
  </main>

  <!-- Detail modal -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="sheet-head">
        <div>
          <div class="eyebrow" id="mSlot"></div>
          <h2 id="mTitle"></h2>
        </div>
        <button class="icon-btn" id="mClose" aria-label="닫기">✕</button>
      </div>
      <div class="sheet-body" id="mBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
